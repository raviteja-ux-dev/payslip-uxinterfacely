<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pay Slip Generator</title>
  </head>
  <body>
    <form id="payslipgenerator" name="payslipgenerator">
      <div class="payslip-form">
        <div class="main-head">
          <h4> CTC Payslip Generator</h4>
        </div>
        <div id="formCreation" class="form-creation">
         <div class="form-control">
            <label for="name">Name</label>
            <input class="form-inputs" type="text" name="Name" id="name" value="">
         </div>

          <!-- Start date field-->
         <div class="form-control">
            <label for="StartDate">Start Date</label>
            <input class="form-inputs" type="date" id="startDate" name="StartDate" onchange="calculateDays()">
         </div>

          <!--end date field-->         
          <div class="form-control">
            <label for="enddate">End Date</label>
            <input class="form-inputs" type="date" id="endDate" name="EndDate" onchange="calculateDays()">
         </div>              

          <!--Designation field--> 
          <div class="form-control">
            <label for="Designation">Designation</label>
            <input class="form-inputs" type="text" id="Designation" value="" name="Designation">
         </div>         

          <!--Annual Ctc field-->      
          <div class="form-control">
            <label for="AnnualCTC">Annual CTC</label>
            <input class="form-inputs" type="text" id="AnnualCTC" value="" name="AnnualCTC">
         </div>         
        
          <!--employee-id field-->  
          <div class="form-control">
            <label for="AssociateID">Associate ID</label>
            <input class="form-inputs" type="text" id="AssociateID" value="" name="AssociateID">
         </div>         
        
          <!--join date field-->
          <div class="form-control">
            <label for="JoinDate">Join Date</label>
            <input class="form-inputs" type="date" id="JoinDate" value="" name="JoinDate">
          </div> 

          <!-- location field -->
          <div class="form-control">
            <label for="location">Location</label>
            <input class="form-inputs" type="text" id="location" value="" name="location">
          </div>         
          <!-- department field -->
          <div class="form-control">
            <label for="Department">Department</label>
            <input class="form-inputs" type="text" id="Department" value="" name="Department">
         </div>

          <!-- payable days field -->
          <div class="form-control">
            <label for="DaysPayable">Days Payable</label>
            <input class="form-inputs" type="number" id="DaysPayable" readonly>
         </div>         

          <!-- working days field -->
          <div class="form-control">
            <label for="DaysWorked">Days Worked</label>
            <input class="form-inputs" type="number" id="DaysWorked" readonly>
         </div>  

          <!-- lop field --> 
          <div class="form-control">
            <label for="Lopdays">LOP Days</label>
            <select id="lopdays" class="form-inputs" onchange="toggleLop()">
              <option value="">Select</option>  
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
         </div>

          <div class="form-control" id="Loppaydbox" style="display: none;">
              <label for="loppayfield">Lop Days </label>
              <input type="number" id="LopPayField" class="form-inputs" name="Lopdaysfield" oninput="updatelop()">               
          </div>

          <!-- pan field -->
          <div class="form-control">
            <label for="pan">PAN</label>
            <input class="form-inputs" type="text" id="pan" value="" name="pan">
         </div> 

          <!-- variable field -->
        <div class="form-control">
          <label for="variablePay">Variable Pay</label>
          <select id="variablePay" class="form-inputs" onchange="toggleVariablePay()">               
            <option value="">Select</option>  
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>

          <div class="form-control" id="variablePayAmount" style="display: none;">
              <label for="variableAmount">Variable Pay Amount</label>
              <input type="number" id="variableAmount" class="form-inputs" name="variablepayamount" oninput="updateVariablePay()">               
          </div>

          <!-- Bonus field -->
          <div class="form-control">
            <label for="Bonus">Bonus</label>
            <select id="Bonus" class="form-inputs" onchange="toggleBonus()">
              <option value="">Select</option>
              <option value="yes"> Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="form-control" id="BonusAmountBox" style="display:none;">
            <label for="BonusAmount">Bonus Amount</label>
            <input type="number" id="BonusAmount" class="form-inputs" name="bonusamount" oninput="updateBonus()">
          </div>

          <!-- PF Field -->
          <div class="form-control">
            <label for="PF">PF</label>
            <select id="PFfield" class="form-inputs" onchange="togglePF()">
              <option value="">Select</option>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

           <div class="form-control" id="PFamountBox" style="display:none;">
              <label>Employee Fund</label>
              <input class="form-inputs" type="number" id="pfEmployee" oninput="updatePF()">
              <label>Employer Fund</label>
              <input class="form-inputs" type="number" id="pfEmployer" oninput="updatePF()">
            </div>
          
          <!-- UAN field -->
          <div class="form-control">
              <label for="UAN">UAN</label>
              <select class="form-inputs" id="UAN" onchange="toggleUan()">
                  <option value="">Select</option>
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
              </select>
          </div>

          <!-- Hidden UAN Number -->
          <div class="form-control" id="uanNumberBox" style="display:none;">
              <label for="uanNumber">UAN Number</label>
              <input type="number" id="uanNumber" class="form-inputs">
          </div>

          <!-- gst field -->
          <div class="form-control">
            <label for="gst">GST</label>
            <input class="form-inputs" id="gst" type="text" value="36AAIFU2638L1ZQ">
          </div>

          <!-- TDS Field -->
          <div class="form-control">
            <label for="tds">TDS</label>
            <select id="tds" class="form-inputs" onchange="toggleTds()">           
              <option value="">Select</option>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <!--hidden TDS field -->
          <div class="form-control" id="tdsAmountBox" style="display:none;">        
              <label>TDS Amount</label>-
              <input id="tdsAmount" class="form-inputs"> 
          </div>
        </div>

        <!-- Form Action Toolbar (Stays above Payslip Layout) -->
        <div class="action-toolbar print-hide" id="formToolbar">
          <button type="button" class="btn-primary" onclick="generatePayslip()"> Generate Payslip </button>               
        </div>
        <div class="excel-section">
          <label>Upload Excel</label>
          <input type="file" id="excelFile" accept=".xlsx,.xls">
          <p>Excel Entries :<span id="excelCount">0</span></p>
          <div class="excel-navigation">
            <button id="prevEmployee"  >Previous</button>
            <span id="currentEmployee">Payslip 0 of 0</span>
            <button id="nextEmployee">Next</button>
          </div>         
        </div>   
      </div>
    </form>

    <!-- PAYSLIP SECTION -->
      <div id="payslipLayout" class="payslip-layout" style="display:none;">
          <div class="main-head">
            <h2>
              <input type="text" id="paymonth" readonly>
            </h2>          
          </div>

        <!-- Employee Details Table -->
        <div class="table-wrapper">
          <table id="employeeTable" class="emp-table">
          <tr>
            <td rowspan="4" class="logo">
              <img src="logo.png" alt="UXinterfacely Logo">
            </td>
            <th>Employee ID</th>
            <td>
              <input type="text" id="empid" readonly>
            </td>
            <th>Name</th>
            <td>
              <input type="text" id="empname" readonly>
            </td>
          </tr>

          <tr>
            <th>Base Location</th>
            <td id="baseLocation"> </td>           
            <th>Designation</th>
            <td>
              <input type="text" id="designation" readonly>
            </td>
          </tr>

          <tr>
            <th>PAN</th>
            <td>
              <input type="text" id="displayPan" readonly>
            </td>
            <th>Date Of Joining</th>
              <td>
                <input type="date" id="joindate" readonly>
              </td>            
          </tr>
          <tr>
            <th>UAN</th>
            <td>
              <input type="text" id="displayUan" readonly>
            </td>    
            <th> GST NO:</th>
            <td> 36AAIFU2638L1ZQ</td>
          </tr>
        </table>
        </div>

        <!-- Unified Salary Table (Divided into 4 Columns) -->
        <table class="salary-table" id="salaryTable">
          <thead>
            <tr>
              <th style="width: 30%;">Earnings</th>
              <th style="width: 20%;">Current Month</th>
              <th style="width: 30%;">Deductions</th>
              <th style="width: 20%;">Current Month</th>
            </tr>
          </thead>
          <tbody id="salaryTableBody">
            <!-- Rows are dynamically paired & rendered by JS -->
          </tbody>
          <tfoot>
            <tr>
              <th>Total</th>
              <th><input id="totalEarnings" readonly></th>
              <th>Total</th>
              <th><input id="totalDeduction" readonly></th>
            </tr>
          </tfoot>
        </table>

        <!-- Net Pay Statement -->
        <div class="net-pay-statement">
          Net Pay of Rs. <span id="netpay">0.00</span> ( Rupees <span id="amountWords">Zero</span> Only ) Credited into your bank account.
        </div>
      <!-- Action Buttons Toolbar -->
      <div class="action-toolbar print-hide" id="actionToolbar" style="display:none;">
        <button type="button" class="btn-pdf" onclick="downloadPDF()"> Download PDF </button>
        <button type="button" class="btn-print" onclick="printPayslip()"> Print Payslip </button>
        <button type="button" class="btn-excel" onclick="addCurrentRowToExcel()"> Add Current Row </button>
        <button type="button" class="btn-clear" onclick="clearExcelRows()"> Clear Stored Rows </button>
      </div>

   <!-- Libraries -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
   <script src="script.js"></script> 
  </body>
</html>
